schema_version: "1.0"
name: architect-brainstorm
description: On a vague intent the architect returns questions with options instead of guessing a spec.
tags: [architect]
context:
  add_dirs: [fixture]
execution:
  prompt: |
    Spawn the spaceport architect agent with the Agent tool, with this exact prompt:
    "Work order: .liftoff/wo/001-share-orders under the repo root.
    Repo root: evals/architect-brainstorm/fixture under the spaceport plugin root (two levels above your draft-docs
    skill's base directory). Read-only; read nothing else in the plugin."
    Then reply with the architect's report, verbatim.
  max_turns: 30
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Agent]
runs: 3
graders:
  - type: regex
    name: status-questions
    pattern: 'Status: questions'
  - type: regex
    name: no-draft
    pattern: 'Draft:\s*none'
  - type: regex
    name: recommends
    pattern: 'recommend'
    flags: i
