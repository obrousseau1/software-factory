schema_version: "1.0"
name: architect-spec
description: Architect drafts a spec with numbered, testable requirements from a settled intent.
tags: [architect]
context:
  add_dirs: [fixture]
execution:
  prompt: |
    Spawn the spaceport architect agent with the Agent tool, with this exact prompt:
    "Mode: spec. Work order: .liftoff/wo/001-discount under the repo root.
    No more questions: decide and record in Decisions.
    Repo root: evals/architect-spec/fixture under the spaceport plugin root (two levels above your draft-docs
    skill's base directory). Read-only; read nothing else in the plugin."
    Then reply with the architect's report, verbatim.
  max_turns: 30
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Agent]
runs: 3
graders:
  - type: regex
    name: status-draft
    pattern: 'Status: draft'
  - type: regex
    name: requirement-ids
    pattern: '^### R-01: [\s\S]*^### R-02: '
    flags: m
  - type: regex
    name: given-when-then
    pattern: '[Gg]iven [^\n]*when [^\n]*then'
  - type: regex
    name: decisions-rejected
    pattern: '\|\s*Decision\s*\|\s*Rejected\s*\|\s*Why\s*\|\s*By\s*\|'
