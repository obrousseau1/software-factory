schema_version: "1.0"
name: profiler-dotnet-react-vite
description: Profiler profiles a .NET + React/Vite repo with the right stack and gate commands.
tags: [profiler]
context:
  add_dirs: [fixture]
execution:
  prompt: |
    Spawn the spaceport profiler agent with the Agent tool, with this exact prompt:
    "Profile pass. Repo root: evals/profiler-dotnet-react-vite/fixture under the spaceport plugin root (two levels above your
    explore-repo skill's base directory). Read-only; read nothing else in the plugin.
    Profile: .liftoff/profile.md in the current working directory."
    Then reply with the profiler's report, verbatim.
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Write, Skill, Agent]
runs: 3
graders:
  - type: file_exists
    name: profile-written
    path: .liftoff/profile.md
  - type: regex
    name: stack
    target: { source: file, path: .liftoff/profile.md }
    pattern: '^stack: dotnet-react-vite\s*$'
    flags: m
  - type: regex
    name: build-both
    target: { source: file, path: .liftoff/profile.md }
    pattern: '^gate-build: .*dotnet build.*&&.*pnpm.*build'
    flags: m
  - type: regex
    name: test-both-non-watch
    target: { source: file, path: .liftoff/profile.md }
    pattern: '^gate-test: .*dotnet test.*&&.*pnpm.*(\btest\b|vitest run)'
    flags: m
  - type: regex
    name: lint-pnpm
    target: { source: file, path: .liftoff/profile.md }
    pattern: '^gate-lint: .*pnpm.*lint'
    flags: m
  - type: regex
    name: req-tag-xunit
    target: { source: file, path: .liftoff/profile.md }
    pattern: '^req-tag: .*Trait'
    flags: m
