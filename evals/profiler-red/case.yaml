schema_version: "1.0"
name: profiler-red
description: On a retry, the profiler reports a real test failure as repo red and keeps the test command intact.
tags: [profiler]
context:
  add_dirs: [fixture]
execution:
  prompt: |
    Spawn the spaceport profiler agent with the Agent tool, with this exact prompt:
    "Profile pass. Repo root: evals/profiler-red/fixture under the spaceport plugin root (two levels above your
    explore-repo skill's base directory). Read-only; read nothing else in the plugin.
    Profile: .liftoff/profile.md in the current working directory.
    Failures:
    Gates: 2/3
    | Gate | Result | Evidence |
    |------|--------|----------|
    | format | ✅ | |
    | build | ✅ | |
    | test | ❌ | Failed CalcTests.Adds: Assert.Equal() Failure: Expected: 5 Actual: -1 |"
    Then reply with the profiler's report, verbatim.
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Write, Skill, Agent]
runs: 3
graders:
  - type: regex
    name: reports-red
    pattern: 'Red:.*test'
    flags: i
  - type: regex
    name: test-not-weakened
    target: { source: file, path: .liftoff/profile.md }
    pattern: '^gate-test: dotnet test( \S+\.(csproj|sln))?\s*$'
    flags: m
