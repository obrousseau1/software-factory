schema_version: "1.0"
name: profiler-unknown
description: Profiler meets an unknown shape (Go), writes a best-effort profile with stack other and a stack proposal.
tags: [profiler]
context:
  add_dirs: [fixture]
execution:
  prompt: |
    Spawn the spaceport profiler agent with the Agent tool, with this exact prompt:
    "Profile pass. Repo root: evals/profiler-unknown/fixture under the spaceport plugin root (two levels above your
    explore-repo skill's base directory). Read-only; read nothing else in the plugin.
    Profile: .liftoff/profile.md in the current working directory; proposals go under
    .liftoff/proposals/ there too."
    Then reply with the profiler's report, verbatim.
  max_turns: 40
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Write, Skill, Agent]
runs: 3
graders:
  - type: regex
    name: stack-other
    target: { source: file, path: .liftoff/profile.md }
    pattern: '^stack: other\s*$'
    flags: m
  - type: regex
    name: go-test
    target: { source: file, path: .liftoff/profile.md }
    pattern: '^gate-test: .*go test'
    flags: m
  - type: regex
    name: proposal-stack
    target: files
    pattern: 'proposals.[\w-]+.stack\.md'
  - type: regex
    name: proposal-expected-profile
    target: files
    pattern: 'proposals.[\w-]+.expected-profile\.md'
