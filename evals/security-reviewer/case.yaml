schema_version: "1.0"
name: security-reviewer
description: Security reviewer flags the command injection in the grep call as Critical.
tags: [reviewer]
context:
  add_dirs: [fixture]
execution:
  prompt: |
    Spawn the spaceport security-reviewer agent with the Agent tool, with this exact prompt:
    "Work order: 001-discount. Shred 1, round 1.
    Repo: evals/security-reviewer/fixture under the spaceport plugin root (two levels above your log-finding
    skill's base directory). Worktree: <repo>/worktree. Diff: <repo>/.liftoff/wo/001-discount/shreds/1/diff-r1.patch.
    Findings file: .liftoff/wo/001-discount/shreds/1/findings/r1-security-reviewer.md in the current working
    directory. The repo is read-only; read nothing else in the plugin."
    Then reply with the reviewer's report, verbatim.
  max_turns: 30
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Write, Skill, Agent]
runs: 3
graders:
  - type: regex
    name: status-done
    pattern: 'Status: done'
  - type: regex
    name: seeded-defect-blocks
    target: { source: file, path: .liftoff/wo/001-discount/shreds/1/findings/r1-security-reviewer.md }
    pattern: '^\|\s*\d+\s*\|\s*Critical\s*\|[^\n]*(inject|execSync|shell|command)'
    flags: im
